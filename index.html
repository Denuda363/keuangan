<!doctype html>

    <!-- AI Studio Preview: HMR is disabled, suppress Vite WebSocket connection errors -->
    <script>
      (function() {
        if (typeof window !== 'undefined' && window.WebSocket) {
          var NativeWebSocket = window.WebSocket;
          function ViteMockWebSocket(url, protocols) {
            var urlStr = String(url || '');
            var isVite = urlStr.includes('vite') ||
                         urlStr.includes('24678') ||
                         urlStr.includes('token=') ||
                         protocols === 'vite-hmr' ||
                         protocols === 'vite-ping';
            if (isVite) {
              var listeners = {};
              var dummy = {
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,
                readyState: 1, // Mark OPEN immediately so Vite never rejects with "WebSocket closed without opened"
                url: urlStr,
                protocol: protocols || '',
                extensions: '',
                bufferedAmount: 0,
                binaryType: 'blob',
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null,
                addEventListener: function(type, listener) {
                  if (!listeners[type]) listeners[type] = [];
                  listeners[type].push(listener);
                  if (type === 'open') {
                    setTimeout(function() {
                      try { listener({ type: 'open' }); } catch(e) {}
                      if (typeof dummy.onopen === 'function') {
                        try { dummy.onopen({ type: 'open' }); } catch(e) {}
                      }
                    }, 0);
                  }
                },
                removeEventListener: function(type, listener) {
                  if (listeners[type]) {
                    listeners[type] = listeners[type].filter(function(l) { return l !== listener; });
                  }
                },
                dispatchEvent: function(event) {
                  var arr = listeners[event.type] || [];
                  arr.forEach(function(fn) { try { fn(event); } catch(e) {} });
                  return true;
                },
                send: function() {},
                close: function() {
                  dummy.readyState = 3;
                }
              };
              return dummy;
            }
            return new NativeWebSocket(url, protocols);
          }
          ViteMockWebSocket.prototype = NativeWebSocket.prototype;
          ViteMockWebSocket.CONNECTING = NativeWebSocket.CONNECTING;
          ViteMockWebSocket.OPEN = NativeWebSocket.OPEN;
          ViteMockWebSocket.CLOSING = NativeWebSocket.CLOSING;
          ViteMockWebSocket.CLOSED = NativeWebSocket.CLOSED;
          window.WebSocket = ViteMockWebSocket;
        }

        // Catch and prevent any stray Vite WebSocket unhandled promise rejection or error
        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason) {
            var msg = String(event.reason.message || '');
            var stack = String(event.reason.stack || '');
            if (msg.includes('WebSocket') || stack.includes('@vite/client')) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          }
        }, true);

        window.addEventListener('error', function(event) {
          if (event) {
            var msg = String(event.message || '');
            var filename = String(event.filename || '');
            if (msg.includes('WebSocket') || filename.includes('@vite/client')) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          }
        }, true);
      })();
    </script>
