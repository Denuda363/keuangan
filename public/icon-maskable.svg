<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="mBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="mGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="mCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="mShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.35" flood-color="#022c22" />
    </filter>
  </defs>

  <!-- Maskable full bleed background: no corner radius because OS clips it -->
  <rect width="512" height="512" fill="url(#mBgGrad)" />

  <!-- Inner artwork safely inside 80% safe center area (within 51.2px - 460.8px) -->
  <g transform="translate(51, 51) scale(0.8)">
    <g filter="url(#mShadow)">
      <!-- Card background -->
      <rect x="90" y="130" width="332" height="252" rx="40" fill="url(#mCardGrad)" />
      
      <!-- Spine / Header -->
      <path d="M90 170 C90 148 108 130 130 130 L382 130 C404 130 422 148 422 170 L422 196 L90 196 Z" fill="#0f172a" />
      
      <!-- Dots -->
      <circle cx="125" cy="163" r="8" fill="#ef4444" />
      <circle cx="155" cy="163" r="8" fill="#f59e0b" />
      <circle cx="185" cy="163" r="8" fill="#10b981" />
      
      <!-- Money in arrow -->
      <g transform="translate(155, 245)">
        <circle cx="0" cy="0" r="38" fill="#ecfdf5" />
        <path d="M0 18 L0 -18 M-14 -4 L0 -18 L14 -4" stroke="#059669" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      </g>

      <!-- Money out arrow -->
      <g transform="translate(256, 245)">
        <circle cx="0" cy="0" r="38" fill="#fff1f2" />
        <path d="M0 -18 L0 18 M-14 4 L0 18 L14 4" stroke="#e11d48" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      </g>

      <!-- Gold coin badge -->
      <g transform="translate(355, 245)">
        <circle cx="0" cy="0" r="38" fill="url(#mGoldGrad)" />
        <circle cx="0" cy="0" r="30" fill="none" stroke="#fef3c7" stroke-width="3" stroke-dasharray="4 2" />
        <text x="0" y="12" font-family="Arial, sans-serif" font-weight="900" font-size="30" fill="#78350f" text-anchor="middle">Rp</text>
      </g>

      <!-- Bottom ledger lines -->
      <rect x="120" y="320" width="150" height="16" rx="8" fill="#cbd5e1" />
      <rect x="120" y="348" width="90" height="12" rx="6" fill="#e2e8f0" />
      <rect x="290" y="320" width="102" height="22" rx="11" fill="#059669" />
    </g>
  </g>
</svg>
