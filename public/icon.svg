<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-opacity="0.3" flood-color="#022c22" />
    </filter>
    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15" flood-color="#000000" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle grid / pattern accent -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#34d399" stroke-opacity="0.15" stroke-width="4" />
  <circle cx="256" cy="256" r="215" fill="none" stroke="#34d399" stroke-opacity="0.08" stroke-width="2" />

  <!-- Main Wallet / Ledger Container -->
  <g filter="url(#shadow)">
    <!-- Back card / ledger -->
    <rect x="110" y="140" width="292" height="232" rx="36" fill="url(#cardGrad)" />
    
    <!-- Spine / header strip -->
    <path d="M110 176 C110 156 126 140 146 140 L366 140 C386 140 402 156 402 176 L402 200 L110 200 Z" fill="#0f172a" />
    
    <!-- Ledger header dots -->
    <circle cx="145" cy="170" r="7" fill="#ef4444" />
    <circle cx="170" cy="170" r="7" fill="#f59e0b" />
    <circle cx="195" cy="170" r="7" fill="#10b981" />
    
    <!-- Money arrows symbol: Green Up & Rose Down -->
    <!-- Up arrow (Income / Pemasukan) -->
    <g transform="translate(170, 240)">
      <circle cx="0" cy="0" r="34" fill="#ecfdf5" />
      <path d="M0 16 L0 -16 M-12 -4 L0 -16 L12 -4" stroke="#059669" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>

    <!-- Down arrow (Expense / Pengeluaran) -->
    <g transform="translate(260, 240)">
      <circle cx="0" cy="0" r="34" fill="#fff1f2" />
      <path d="M0 -16 L0 16 M-12 4 L0 16 L12 4" stroke="#e11d48" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>

    <!-- Gold Coin Badge (Wealth / Pro) -->
    <g transform="translate(345, 240)" filter="url(#innerGlow)">
      <circle cx="0" cy="0" r="34" fill="url(#goldGrad)" />
      <circle cx="0" cy="0" r="26" fill="none" stroke="#fef3c7" stroke-width="3" stroke-dasharray="4 2" />
      <text x="0" y="11" font-family="Arial, sans-serif" font-weight="900" font-size="28" fill="#78350f" text-anchor="middle">Rp</text>
    </g>

    <!-- Bottom summary bar -->
    <rect x="140" y="310" width="130" height="14" rx="7" fill="#cbd5e1" />
    <rect x="140" y="334" width="80" height="10" rx="5" fill="#e2e8f0" />
    <rect x="290" y="310" width="82" height="18" rx="9" fill="#059669" />
  </g>

  <!-- Sparkle Accent -->
  <path d="M390 100 Q400 120 420 130 Q400 140 390 160 Q380 140 360 130 Q380 120 390 100 Z" fill="#fbbf24" />
</svg>
